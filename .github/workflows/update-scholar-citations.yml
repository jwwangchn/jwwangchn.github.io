name: Update Google Scholar citations

on:
  schedule:
    # Retry across separate runners when Scholar temporarily blocks an IP.
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-scholar-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"

      - name: Fetch latest Google Scholar citation count
        run: |
          for attempt in 1 2 3; do
            if ruby scripts/update_scholar_citations.rb; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 60
            fi
          done
          echo "::error::Google Scholar refresh failed; keeping the last successful count and date."
          exit 1

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- _data/socials.yml; then
            echo "No citation changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/socials.yml
          git commit -m "Update Google Scholar citation count"
          git push
