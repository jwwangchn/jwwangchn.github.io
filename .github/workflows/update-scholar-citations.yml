name: Update Google Scholar citations

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-scholar-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"

      - name: Fetch latest Google Scholar citation count
        run: ruby scripts/update_scholar_citations.rb

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- _data/socials.yml; then
            echo "No citation changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/socials.yml
          git commit -m "Update Google Scholar citation count"
          git push
